name: Release

# A release starts in one of three ways:
# - a change to the version in Cargo.toml reaches main (usually by merging a
#   pull request). The workflow tags that commit and releases it.
# - "Run workflow" on the Actions tab releases the version that Cargo.toml on
#   main names. If that version was released before, it is built again.
# - a tag like v0.2.0 is pushed, or a release with a new tag is published on
#   the GitHub website.
# The release stays a draft until every download is uploaded, so update
# checks never see a release with missing files.

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which tag to release, and whether it exists yet. A push to main whose
  # version already has a tag releases nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ -n "$v" ] || { echo "::error::No version in [workspace.package] of Cargo.toml"; exit 1; }
          tag="v$v"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo "::notice::$tag is already released. Change the version in Cargo.toml to release again."
              exit 0
            fi
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prepare:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Check version and signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          v="${TAG#v}"
          grep -q "^version = \"$v\"" Cargo.toml || { echo "::error::Cargo.toml has a different version than the tag $TAG"; exit 1; }
          [ -s crates/stackline/updater.pub ] || { echo "::error::crates/stackline/updater.pub is empty. See RELEASING.md"; exit 1; }
          [ "$(jq -r .plugins.updater.pubkey desktop/src-tauri/tauri.conf.json)" = "$(tr -d '\r\n' < crates/stackline/updater.pub)" ] || { echo "::error::plugins.updater.pubkey in desktop/src-tauri/tauri.conf.json differs from crates/stackline/updater.pub"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. See RELEASING.md"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          cat notes.md
      # Checks pass, so tag the commit. A tag made with the workflow's own
      # token does not start this workflow a second time.
      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$(git rev-parse HEAD)" > /dev/null
            echo "Tagged $(git rev-parse --short HEAD) as $TAG"
          fi
      - name: Create draft release
        id: create
        uses: actions/github-script@v9
        with:
          script: |
            const tag = process.env.TAG
            const release = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Stackline ${tag.slice(1)}`,
              body: require('fs').readFileSync('notes.md', 'utf8'),
              draft: true,
              prerelease: tag.includes('-'),
            }
            // A release made on the GitHub website creates the tag too. Turn it
            // back into a draft until every download is uploaded.
            const existing = await github.rest.repos
              .getReleaseByTag({ owner: release.owner, repo: release.repo, tag })
              .catch((e) => (e.status === 404 ? null : Promise.reject(e)))
            if (existing) {
              const { data } = await github.rest.repos.updateRelease({ ...release, release_id: existing.data.id })
              return data.id
            }
            const { data } = await github.rest.repos.createRelease(release)
            return data.id

  # Single binaries for `stackline serve`. Each one is signed so that
  # `stackline serve` can verify it before replacing itself.
  binaries:
    needs: [version, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p stackline --target ${{ matrix.target }}
      - name: Sign and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          name="stackline-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/stackline$ext" "$name"
          npx --yes @tauri-apps/cli@2 signer sign "$name"
          # Copies under the name before the rename, which swarmdash 0.4 and
          # older look for when they update themselves.
          old="swarmdash-${{ matrix.target }}$ext"
          cp "$name" "$old"
          cp "$name.sig" "$old.sig"
          gh release upload "$TAG" "$name" "$name.sig" "$old" "$old.sig" --clobber

  # Desktop installers, plus latest.json for the desktop app's updater.
  desktop:
    needs: [version, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: '' }
          - { os: macos-14, args: '--target universal-apple-darwin' }
          - { os: windows-latest, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: ui
      - run: npm ci
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [version, binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
