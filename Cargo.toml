[workspace]
resolver = "2"
members = ["crates/swarmdash-core", "crates/swarmdash", "desktop/src-tauri"]
default-members = ["crates/swarmdash-core", "crates/swarmdash"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/swarmdash"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
