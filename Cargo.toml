[workspace]
resolver = "2"
members = ["crates/stackline-core", "crates/stackline", "desktop/src-tauri"]
default-members = ["crates/stackline-core", "crates/stackline"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/stackline"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# SQLite does the heavy lifting in the store tests; unoptimized it is several times slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
