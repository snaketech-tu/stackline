[package]
name = "stackline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
mime_guess = "2.0.5"
minisign-verify = "0.3"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
self-replace = "1.5"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stackline-core = { path = "../stackline-core" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "json", "gzip"] }
webbrowser = "1.2.5"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
